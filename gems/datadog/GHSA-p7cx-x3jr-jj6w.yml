title: ReDOS in URL query string obfuscation
date: 2026-10-13
description: |
  ## SUMMARY

  A regular expression used to obfuscate URL query strings can consume
  excessive CPU when processing certain attacker-controlled input.
  This can stall request processing and cause denial of service in
  applications using affected HTTP tracing integrations.

  ## Impact

  Regular expression denial of service (ReDoS) affecting applications
  that process attacker-controlled URL query strings through the
  vulnerable obfuscation pattern. Successful exploitation can cause
  excessive CPU consumption, prolonged request latency, and service
  unavailability.

  Only Ruby versions below 3.2 are affected, and the query obfuscation
  feature is disabled by default.
