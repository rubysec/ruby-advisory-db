gem: rack
ghsa: 5v64-555j-wjxm
url: https://github.com/rack/rack/security/advisories/GHSA-5v64-555j-wjxm
title: Multipart parser retains parsed data in its scan buffer,
  allowing denial of service via memory exhaustion.
date: 2026-10-30
description: |
  Rack::Multipart::Parser reads the request body in chunks of
  rack.multipart.buffer_size (1 MiB by default) into an internal
  scan buffer. Parsed bytes are only discarded from that buffer
  when a chunk ends inside a part body. A request whose parts are
  sized so that every chunk ends inside, or immediately after, a
  part's headers is never compacted, so the buffer grows to the
  size of the request.

  This results in a denial of service condition through memory
  exhaustion for applications that parse multipart requests.

  ## Impact

  Any application that parses multipart requests with Rack is affected
  in its default configuration. An unauthenticated attacker can cause
  a single request to hold memory proportional to its size for the
  duration of parsing, exhausting worker memory. The attack requires
  only a well-formed multipart body.
