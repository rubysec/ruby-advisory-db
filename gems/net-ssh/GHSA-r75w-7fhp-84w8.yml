title: Pre-auth unbounded banner/identification buffering DoS
date: 2026-10-05
description: |
  ## Summary

  Net::SSH::Transport::ServerVersion#read! appends each received byte
  to @version (@version << b) until \n, then copies to @header
  (@header << @version). No maximum line length or total byte cap is
  enforced. A malicious server sending a long identification line
  without LF causes unbounded client memory growth pre-authentication.

  ## Credit

  Reported by zhangph (afldl), 2026-07.
