url: https://github.com/net-ssh/net-ssh/security/advisories/GHSA-pfqh-p9vh-wx4p
title: Pre-auth unbounded transport packet_size leads to memory exhaustion
date: 2026-10-05
description: |
  ## Summary

  net-ssh's transport packet reader trusts the 4-byte wire packet length
  without capping it against RFC 4253 §6.1 (35000 bytes). Pre-KEX
  (plaintext), a malicious server can declare an arbitrarily large
  packet length and stream data, causing unbounded client memory
  growth before authentication.

  ## Credit

  Reported by zhangph (afldl), 2026-07.
