url: https://github.com/net-ssh/net-ssh/security/advisories/GHSA-ggxh-cfwq-5xqc
title: Pre-auth unbounded KEX packet queue leads to memory exhaustion
date: 2026-10-05
description: |
  ## Summary

  Net::SSH::Transport::Session#poll_message pushes every packet received
  during key exchange that is not on the "allowed during KEX" list into
  an unbounded @queue (Array), with no size cap. A malicious server
  that completes KEXINIT (putting net-ssh into pending KEX) and then
  floods non-allowed packet types causes the client to queue all of
  them — a pre-authentication memory-exhaustion DoS.

  ## Credit

  Reported by zhangph (afldl), 2026-07.
