gem: net-ssh
ghsa: rpq3-v334-f5pm
url: https://github.com/net-ssh/net-ssh/security/advisories/GHSA-rpq3-v334-f5pm
title: Parsing a specifically crafted ed25519 ssh key will lock net/ssh in DOS
date: 2026-10-05
description: |
  ## Summary

  When a crafted ed25519 private key is loaded which contains an insane
  number of rounds, it will lock net/ssh in an infinite CPU-time consuming
  loop for a very long time trying to load the key. That the key itself
  is not a real ssh key does not matter in this regard.

  ## Impact

  The resulting ruby process will hang for several days (estimated at
  least half a year) and be locked in the C call, needing to manually
  terminate the corresponding ruby process.
