    https://github.com/rails/rails/commit/468aa9a93fc98f5476b6821770f4ccfcb7f7d328
  - 8.0:
    https://github.com/rails/rails/commit/ea8c40121ce53a3d0255cd4eb6d13bfe3bc01776

  ### Versions affected

  - activestorage < 8.0.5.2
  - activestorage >= 8.1, < 8.1.4.1

