description: |
  With validate: false, Schema.execute_next (or use
  GraphQL::Execution::Next, as_default: true) runs queries that analysis
  or variable validation rejected. max_complexity, max_depth and other
  analyzer errors, invalid or missing variables, and unknown operation
  names are all ignored. (The legacy interpreter enforces all of
  them with validate: false.)
