title: Gemstash caches and serves unvalidated dependency data from an upstream
date: 2026-11-19
description: |
  ## Summary

  The dependency data Gemstash fetches from an upstream with
  /api/v1/dependencies.json is cached and handed to clients, as JSON
  or as a Marshal dump Gemstash builds. It was cached and passed on
  as it came: entries of any shape, with any extra fields, and
  entries for gems that were never requested were all accepted and cached.

  ## Impact

  Limited: the cache is kept per gem source, so only clients using that
  same source see the data, and JSON cannot produce Ruby objects. It
  still lets an upstream plant arbitrary structures and unrequested
  gems into the Gemstash cache and into what its clients deserialize.
