title: Gem push reads the whole request body into memory before
  checking the API key
date: 2026-11-19
description: |
  ## Summary

  POST /private/api/v1/gems reads the entire request body into memory
  before checking the API key. An unauthenticated client can make the
  server allocate memory in proportion to the size of the upload,
  and the request is only rejected with a 401 afterwards. There is
  no limit on the body size.
