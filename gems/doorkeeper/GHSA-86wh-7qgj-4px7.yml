url: https://github.com/doorkeeper-gem/doorkeeper/security/advisories/GHSA-86wh-7qgj-4px7
title: Open redirect in the authorization endpoint's deny path
date: 2026-09-24
description: |
  DELETE /oauth/authorize (the "deny" action of
  Doorkeeper::AuthorizationsController) builds and sends its access_denied
  error response without validating client_id, redirect_uri or response_type
  first. An authenticated resource owner can therefore be redirected — or
  form_post-submitted — to an arbitrary, unregistered URI supplied in then
  request, and a missing redirect_uri raises an unhandled exception (HTTP 500).
