title: Message corruption and denial of service triggered by crafted
  client message
date: 2026-11-16
description: |
  ## Summary

  An unauthenticated remote client can trigger message corruption and
  denial of service by starting a draft75 or draft76 WebSocket connection
  and sending a brief sequence of bytes. The byte sequence is parsed
  incorrectly and can lead to duplicate messages or server crash.

  ## Details

  The websocket-driver library supports earlier versions of the WebSocket
  protocol from before the RFC was standardised, particularly the draft75
  and draft76 versions. There is a bug in the parsing of messages in these
  versions that can lead to the server duplicating received messages or
  crashing when a client sends a specific sequence of bytes over a
  connection being handled by this parser. No special conditions are
  required and the input message that triggers this behaviour is very
  short, so an attacker can easily crash a remote server.

  To mitigate this, the parser bug has been fixed, and support for draft
  protocol versions has been disabled by default. Servers wanting to
  continue to support these versions need to pass the option
  "allow_drafts: true" when creating a driver instance.

  ## Impact

  Users running a server using websocket-driver to handle WebSocket
  connections are vulnerable to denial of service triggered by a single
  frame sent by an unauthenticated client. The only known mitigation is
  to upgrade to a patched release.
