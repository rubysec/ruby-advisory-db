url: https://github.com/rgrove/crass/security/advisories/GHSA-pq4g-8rxf-4g29
title: Incorrect tokenization of bad URLs enables CSS sanitizer bypass
date: 2026-10-21
description: |
  ## Summary

  Crass's tokenizer didn't terminate a bad URL token at a ) that followed
  an escaped backslash (\\). As a result, Crass consumed more input as
  part of the bad URL than a spec-compliant browser does. CSS sanitizers
  that parse untrusted CSS with Crass and re-emit it could be tricked
  into passing through declarations, style rules, or at-rules (including
  @import) that the sanitizer would otherwise have removed, but that
  a browser would then parse and apply.

  ## Impact

  Crass by itself only mis-tokenizes input. The security impact is on
  CSS sanitizers that use Crass to make allow/deny decisions and then
  re-serialize the CSS. Exploitation requires a sanitizer that doesn't
  reject bad URL tokens wherever they occur.
