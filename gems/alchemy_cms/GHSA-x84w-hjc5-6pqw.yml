url: https://github.com/AlchemyCMS/alchemy_cms/security/advisories/GHSA-x84w-hjc5-6pqw
title: Stored XSS via unvalidated URL schemes in menu nodes
  and linkable ingredients
date: 2026-11-09
description: |
  Alchemy::Node validated its url with a pattern that accepted any URI
  scheme, and the linkable ingredients (Link, Text, Picture) never
  validated their url at all. A user with permission to edit menus or
  element content could therefore store a javascript: url, which the
  menu template and the ingredient view components render as the href
  of an <a> element. Activating such a link executes the stored script
  in the site's origin, with the privileges of whoever clicked it.
cvss_v3: 5.4
