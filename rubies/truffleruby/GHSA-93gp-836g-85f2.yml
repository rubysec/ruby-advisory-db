title: Dependency Confusion — Unclaimed RubyGem `deep-bench`
  Referenced in TruffleRuby Documentation
date: 2026-06-12
description: |
  The truffleruby repository references the RubyGem deep-bench in its
  contributor documentation with an explicit gem install instruction.
  This gem name is not registered on RubyGems.org — the name is
  unclaimed and available for anyone to register.

  Any developer following the official documentation and running
  `gem install deep-bench` would execute arbitrary code from the public
  RubyGems registry if an attacker registers a malicious gem under that name.

  As of 10/14/2026, there is now a page:`deep-bench` under
  * https://rubygems.org/gems/deep-bench/versions/0.0.1.pre
patched_versions:
  - ">= 0.0.1.pre"
