title: Heap buffer overflow in regular expression compilation
date: 2026-11-18
description: |
  ## Summary

  Ruby has an integer overflow in its regular expression engine, which causes a
  heap-based buffer overflow. Compiling a crafted regular expression pattern may
  allow remote code execution in applications that compile attacker-controlled
  patterns. The Ruby team is aware of PoCs that prove this flaw can be used to
  trigger RCE in some scenarios.

  ## Details

  When compiling a regular expression, the size of the compiled program could
  overflow, and Ruby could write past the end of a heap buffer.

  ## Patches

  Upgrade to Ruby 3.3.14, 3.4.13 or 4.0.10.

  ## Credits

  Thanks to aphantom (https://hackerone.com/aphantom) for reporting this issue.
