title: Double free in regular expression compilation
date: 2026-11-18
description: |
  ## Summary

  Ruby has a double free in its regular expression engine. Compiling a crafted
  regular expression pattern may allow remote code execution in applications
  that compile attacker-controlled patterns. The Ruby team is aware of PoCs that
  prove this flaw can be used to trigger RCE in some scenarios.

  ## Details

  When parsing a character class intersection (`&&`) in a regular expression
  pattern, Ruby could free the same buffer twice.

  ## Patches

  Upgrade to Ruby 3.3.14, 3.4.13 or 4.0.10.

  ## Credits

  Thanks to Stephan Lipp (Ada Logics) and Anthropic for reporting this issue.
