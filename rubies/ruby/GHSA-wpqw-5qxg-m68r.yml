title: Out-of-bounds read in case-insensitive regular expression matching
date: 2026-11-18
description: |
  ## Summary

  Ruby has an out-of-bounds read in its regular expression engine. Matching
  against a crafted regular expression pattern may allow remote code execution
  in applications that use attacker-controlled patterns. The Ruby team is aware
  of PoCs that prove this flaw can lead to memory corruption in an
  attacker-controlled way.

  ## Details

  In case-insensitive matching, Ruby could read out of bounds, which can lead to
  memory corruption.

  ## Patches

  Upgrade to Ruby 3.3.14, 3.4.13 or 4.0.10.

  ## Credits

  Thanks to Stephan Lipp (Ada Logics) and Anthropic for reporting this issue.
