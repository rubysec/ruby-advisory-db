title: Integer overflow in case conversion of strings
date: 2026-11-18
description: |
  ## Summary

  Ruby has an integer overflow in the case conversion of strings, which causes a
  heap-based buffer overflow. Changing the case of a crafted string may allow
  remote code execution. The Ruby team is aware of PoCs that prove this flaw can
  be used to trigger RCE in some scenarios.

  ## Details

  When changing the case of a string whose converted result exceeds 4 GiB, the
  length of the result could overflow, and Ruby could write past the end of a
  heap buffer.

  ## Patches

  Upgrade to Ruby 3.3.14, 3.4.13 or 4.0.10.

  ## Credits

  Thanks to baba__yaga (https://hackerone.com/baba__yaga) for reporting this
  issue.
