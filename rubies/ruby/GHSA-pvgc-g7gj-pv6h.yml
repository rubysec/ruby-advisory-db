title: Out-of-bounds read in case-insensitive backreference matching
date: 2026-11-18
description: |
  ## Summary

  Ruby has an out-of-bounds read in its regular expression engine. Matching a
  crafted string may disclose memory contents or crash the process.

  ## Details

  When matching a case-insensitive backreference, Ruby could read past the end
  of the subject string.

  ## Patches

  Upgrade to Ruby 3.3.14, 3.4.13 or 4.0.10.

  ## Credits

  Thanks to Hiroya Fujinami and Hiroshi SHIBATA for reporting this issue.
